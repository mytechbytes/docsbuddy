name: Build Android

# Builds the Android release APK on GitHub's runners (no local Android SDK or
# network-egress changes needed) and uploads it for download. The release build
# is debug-signed (see android/app/build.gradle.kts), so the APK installs
# directly for testing — it is NOT a Play Store upload artifact.
#
# Manual-only: run it from Actions → "Build Android" → Run workflow.
# (macOS/iOS live in build-apple.yml; the Play AAB in release-aab.yml.)

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (debug-signed, installable)
        # Supabase keys come from repo secrets; when unset, the build falls back
        # to the local fake auth (Env.hasSupabase == false).
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FEATURE_PUSH_REMINDERS="$FEATURE_PUSH_REMINDERS" \
            --dart-define=FEATURE_EMAIL_REMINDERS="$FEATURE_EMAIL_REMINDERS" \
            --dart-define=FEATURE_WHATSAPP_REMINDERS="$FEATURE_WHATSAPP_REMINDERS" \
            --dart-define=FEATURE_APPLE_SIGN_IN="$FEATURE_APPLE_SIGN_IN" \
            --dart-define=FEATURE_MICROSOFT_SIGN_IN="$FEATURE_MICROSOFT_SIGN_IN"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Off unless the repository variable is "true" (docs/feature-flags.md).
          FEATURE_PUSH_REMINDERS: ${{ vars.FEATURE_PUSH_REMINDERS }}
          FEATURE_EMAIL_REMINDERS: ${{ vars.FEATURE_EMAIL_REMINDERS }}
          FEATURE_WHATSAPP_REMINDERS: ${{ vars.FEATURE_WHATSAPP_REMINDERS }}
          FEATURE_APPLE_SIGN_IN: ${{ vars.FEATURE_APPLE_SIGN_IN }}
          FEATURE_MICROSOFT_SIGN_IN: ${{ vars.FEATURE_MICROSOFT_SIGN_IN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docsbuddy-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
